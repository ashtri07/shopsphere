name: Order Service CI

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/order-service-ci.yml"
      - "services/order-service/**"
  pull_request:
    paths:
      - ".github/workflows/order-service-ci.yml"
      - "services/order-service/**"

permissions:
  contents: read

concurrency:
  group: order-service-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run unit tests
        run: mvn --batch-mode --no-transfer-progress -f services/order-service/pom.xml test
